<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDY BLOCK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="theme-star">
    <div id="game-container">
        <header>
            <h1>STUDY BLOCK</h1>
            <div class="header-info">
                <span id="trophy-count">🏆 0</span>
                <span id="combo-count">Combo: 0</span>
            </div>
            <button id="settings-btn" class="ui-btn">⚙️ スキン・設定</button>
        </header>

        <div id="grid-container">
            <div id="grid"></div>
        </div>
        
        <div id="blocks-container">
            <!-- 3つのドラッグ＆配置可能なブロックが動的に生成されます -->
        </div>
    </div>

    <!-- コンボ時の褒め言葉ポップアップ -->
    <div id="praise-text" class="hidden"></div>

    <!-- クイズモーダル -->
    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="quiz-title">✏️ ブロッククイズ！</h2>
            <p id="quiz-question">問題がここに表示されます</p>
            <div id="quiz-options">
                <!-- 選択肢ボタン -->
            </div>
        </div>
    </div>

    <!-- 設定・スキン選択モーダル -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>⚙️ 設定 / スキン選択</h2>
            <p class="sub-text">※プレリリース版：全8テーマ解放中！</p>
            <div id="theme-selector">
                <button class="theme-btn active" data-theme="star">🌌 星空</button>
                <button class="theme-btn" data-theme="gum">🎀 ガム</button>
                <button class="theme-btn" data-theme="dopamine">⚡ ネオン</button>
                <button class="theme-btn" data-theme="sea">🌊 海</button>
                <button class="theme-btn" data-theme="nature">🌿 自然</button>
                <button class="theme-btn" data-theme="cafe">☕ カフェ</button>
                <button class="theme-btn" data-theme="anime">🌸 アニメ</button>
                <button class="theme-btn" data-theme="manga">🖊️ 漫画</button>
            </div>
            <div style="margin-top: 20px;">
                <button id="toggle-bgm" class="ui-btn">🔊 Sound: ON</button>
                <button id="close-settings" class="ui-btn primary">閉じる</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
